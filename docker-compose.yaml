services:
  backend:
    volumes:
      - static:/static
      - database:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/db.sqlite3
      STATIC_ROOT: /static
    build:
      context: .
    network_mode: host
    privileged: true
  scanner:
    volumes:
      - static:/static
      - database:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/db.sqlite3
      STATIC_ROOT: /static
    build:
      context: .
    command: ["python", "-u", "manage.py", "run_scheduler", "--run-now"]
    network_mode: host
    privileged: true
    depends_on:
      - backend
  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_UPSTREAM: host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  static:
  database:
