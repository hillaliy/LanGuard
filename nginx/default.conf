upstream backend {
    server backend:8000;
}

server {
    listen 80;

    location /api/v1/ {
        proxy_pass http://backend;
    }  

    location /admin/ {
        proxy_pass http://backend;
    }      

    location /static/ {
        alias /static/;
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}