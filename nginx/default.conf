upstream backend {
    server backend:8000;
}

server {
    listen 80;

    location /api/v1/ {
        proxy_pass http://backend;
    }  

    location /admin/ {
        proxy_pass http://backend;
    }      

    location /static/rest_framework {
        root /static/;
    }

    location ~ /\. {
        deny all;
    }

    location / {
      root /var/www/frontend/build;
      try_files $uri $uri/ /index.html;
    }

    error_log  /var/log/nginx/error.log;
}