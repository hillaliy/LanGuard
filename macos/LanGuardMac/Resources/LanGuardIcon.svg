    <path d="M512 508 418 600"/>
    <path d="M512 508 606 600"/>
  </g>

  <g fill="#071221" stroke="#ffffff" stroke-width="18">
    <rect x="430" y="342" width="164" height="104" rx="26"/>
    <rect x="314" y="586" width="154" height="100" rx="26"/>
    <rect x="556" y="586" width="154" height="100" rx="26"/>
  </g>

  <g fill="#f7fbff">
    <rect x="462" y="373" width="100" height="40" rx="10"/>
    <rect x="346" y="616" width="90" height="38" rx="10"/>
    <rect x="588" y="616" width="90" height="38" rx="10"/>
  </g>

  <g fill="#1db2ff">
    <circle cx="512" cy="508" r="22"/>
    <circle cx="418" cy="600" r="18"/>
    <circle cx="606" cy="600" r="18"/>
